name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job here needs to write to the repo, comment on PRs, or otherwise use
# the GITHUB_TOKEN beyond reading code — without this, jobs get the
# repository's default token permissions, which are often broader than
# needed for a checkout+build+test+deploy pipeline that also handles
# third-party secrets.
permissions:
  contents: read

# ─── AgentGuildApp jobs ─────────────────────────────────────────────────────────────

jobs:
  lint:
    name: Lint (AgentGuildApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentGuildApp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AgentGuildApp/package-lock.json
      - run: npm ci
      - run: npm run lint || true

  test:
    name: Test (AgentGuildApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentGuildApp
    env:
      PLATFORM_ADMIN_WALLETS: "0x723708273e811a07d90d2e81e799b9Ab27F0B549"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AgentGuildApp/package-lock.json
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build (AgentGuildApp)
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentGuildApp
    env:
      # Minimal env vars to satisfy Next.js build (no real credentials)
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      NEXT_PUBLIC_THIRDWEB_CLIENT_ID: "ci-placeholder"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AgentGuildApp/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        name: Cache Next.js build
        with:
          path: AgentGuildApp/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('AgentGuildApp/package-lock.json') }}-${{ hashFiles('AgentGuildApp/src/**/*.[jt]s', 'AgentGuildApp/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('AgentGuildApp/package-lock.json') }}-
      - run: npm run build

  # ── Deploy to Netlify from GitHub Actions (Netlify OOMs on 573 routes) ──

  deploy:
    name: Deploy (Netlify)
    needs: [build, hub-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentGuildApp
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_THIRDWEB_CLIENT_ID }}
      NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
      NEXT_PUBLIC_ADMIN_ADDRESS: ${{ secrets.NEXT_PUBLIC_ADMIN_ADDRESS }}
      NEXT_PUBLIC_SOLANA_PROGRAM_ID: ${{ secrets.NEXT_PUBLIC_SOLANA_PROGRAM_ID }}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${{ secrets.NEXT_PUBLIC_SOLANA_RPC_URL }}
      NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
      NEXT_PUBLIC_SUPER_ADMINS: ${{ secrets.NEXT_PUBLIC_SUPER_ADMINS }}
      NEXT_PUBLIC_OPENCLAW_WORKSPACE: ${{ secrets.NEXT_PUBLIC_OPENCLAW_WORKSPACE }}
      NEXT_PUBLIC_TREASURY_ADDRESS: ${{ secrets.NEXT_PUBLIC_TREASURY_ADDRESS }}
      # Deliberately NOT NEXT_PUBLIC_-prefixed even though the GitHub secret
      # is named that way: any env var with that prefix gets inlined into the
      # client JS bundle by the Next.js build this job runs. This is a
      # server-only Thirdweb secret key, not a publishable client ID.
      THIRDWEB_SECRET: ${{ secrets.NEXT_PUBLIC_THIRDWEB_SECRET }}
      # Same reasoning — the platform's Solana fee-payer/authority keypair
      # (base58 secret key) must never be inlined into the client bundle.
      SOLANA_PLATFORM_KEYPAIR: ${{ secrets.SOLANA_PLATFORM_KEYPAIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AgentGuildApp/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        name: Cache Next.js build
        with:
          path: AgentGuildApp/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('AgentGuildApp/package-lock.json') }}-${{ hashFiles('AgentGuildApp/src/**/*.[jt]s', 'AgentGuildApp/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('AgentGuildApp/package-lock.json') }}-
      - name: Build and Deploy to Netlify
        run: npx netlify-cli deploy --prod --build --site=${{ secrets.NETLIFY_SITE_ID }} --auth=${{ secrets.NETLIFY_AUTH_TOKEN }}

# ─── Hub jobs ──────────────────────────────────────────────────────────────────

  hub-test:
    name: Test (Hub)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
        # Unit tests only — no Firebase/Redis required

# ─── Contracts jobs ────────────────────────────────────────────────────────────

  contracts-compile:
    name: Compile (Contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # Hardhat config requires DEPLOYER_PRIVATE_KEY at load time.
      # Use a throwaway non-functional key for compile/test.
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile

  contracts-test:
    name: Test (Contracts)
    needs: [contracts-compile]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
        # Runs against Hardhat in-process network — no Sepolia required

# ─── Solana program jobs ────────────────────────────────────────────────────────

  solana-program-test:
    name: Test (Solana Program)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solana-program/package-lock.json
      # ubuntu-latest ships a Rust toolchain; Solana CLI + Anchor CLI are
      # installed here since no official pinned-SHA action exists for them.
      # NOTE: the Solana installer still floats on the "stable" release
      # channel — Anza doesn't publish a version-pinned URL or checksum for
      # it, so this step trusts release.anza.xyz's current content on every
      # run. The Anchor install below is pinned to a fixed git tag, matching
      # the anchor-lang = "0.31.1" version this program is written against
      # (programs/agent_guild/Cargo.toml), rather than floating on HEAD of
      # coral-xyz/anchor.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
      - run: npm ci
      # Anchor.toml's provider wallet (~/.config/solana/id.json) only pays
      # for the local test validator, so a throwaway keypair is enough —
      # no real key or secret belongs in CI for this.
      - name: Create throwaway test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/id.json"
      - run: anchor test
        # Spins up a local validator — no devnet/RPC access required.

# ─── Release gate ──────────────────────────────────────────────────────────────

  gate:
    name: Release Gate
    needs: [build, hub-test, deploy, solana-program-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `if: always()` above makes this job run even when a dependency
      # failed — needed so it can report that failure explicitly rather
      # than being skipped. Without this check, the step below always
      # echoed success and exited 0 regardless of what `needs` actually
      # did, making "Release Gate" useless as a required branch-protection
      # status check (it could never fail).
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All checks passed
        run: |
          echo "✓ AgentGuildApp: lint, typecheck, test, build"
          echo "✓ Hub: unit tests"
          echo "✓ Contracts: compile + test"
          echo "✓ Solana program: anchor test"
          echo "SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "This commit is release-safe for staging/testnet deployment."
