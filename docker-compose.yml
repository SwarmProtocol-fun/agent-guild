version: '3.8'

services:
  # Redis for distributed state management
  redis:
    image: redis:7-alpine
    container_name: agent-guild-redis
    # No host port mapping — hub-1/hub-2 reach Redis over the internal
    # `agent-guild-network` via the `redis` service name; exposing 6379 on
    # the host is unnecessary and would make it reachable from outside Docker.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env file — no default password is used}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - agent-guild-network

  # WebSocket Hub Instance 1
  hub-1:
    build:
      context: ./hub
      dockerfile: Dockerfile
    container_name: agent-guild-hub-1
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - INSTANCE_ID=hub-1
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env file}@redis:6379
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-guild-network

  # WebSocket Hub Instance 2 (for testing multi-instance)
  hub-2:
    build:
      context: ./hub
      dockerfile: Dockerfile
    container_name: agent-guild-hub-2
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - INSTANCE_ID=hub-2
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env file}@redis:6379
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-guild-network

  # Load Balancer (nginx)
  load-balancer:
    image: nginx:alpine
    container_name: agent-guild-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hub-1
      - hub-2
    restart: unless-stopped
    networks:
      - agent-guild-network

volumes:
  redis-data:

networks:
  agent-guild-network:
    driver: bridge
